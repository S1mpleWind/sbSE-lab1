name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      # 1. 下载代码
      - uses: actions/checkout@v7

      # TODO 1：安装指定版本的 Go
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'
          cache: false

      # TODO 2：打印 GitHub 事件信息
      - name: Print GitHub context
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "event_name=$EVENT_NAME"
          echo "ref=$REF"
          echo "sha=$SHA"
          echo "pr_head_sha=$PR_HEAD_SHA"

      # TODO 3：分别执行格式检查、静态检查和测试
      - name: Check formatting
        run: make fmt-check

      - name: Run go vet
        run: make vet

      - name: Run tests
        run: make test

      # TODO 4：仅在 push 到 main 时构建和上传
      - name: Package
        if: github.event_name == 'push'
        env:
          VERSION: 0.0.0-main
          BUILD_NO: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: |
          make package \
            VERSION="$VERSION" \
            BUILD_NO="$BUILD_NO" \
            RUN_ID="$RUN_ID" \
            COMMIT="$COMMIT"

      - name: Print checksums
        if: github.event_name == 'push'
        run: |
          sha256sum dist/enroll-conflict_0.0.0-main_linux_amd64/enroll-conflict
          sha256sum dist/*.tar.gz

      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ github.sha }}-${{ github.run_number }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          retention-days: 14
          if-no-files-found: error